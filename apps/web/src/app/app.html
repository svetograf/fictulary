<mat-toolbar>
  <mat-icon>auto_stories</mat-icon>
  <h1>{{ title }}</h1>
  <nav>
    <a
      mat-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Books</a
    >
    @if (signedIn()) {
      <a mat-button routerLink="/upload" routerLinkActive="active">
        <mat-icon>upload_file</mat-icon>
        Upload
      </a>
      <button
        mat-button
        class="account"
        [matMenuTriggerFor]="accountMenu"
        aria-label="Account"
      >
        <mat-icon>account_circle</mat-icon>
        <span class="account-name">{{ user()?.name ?? 'Account' }}</span>
      </button>
      <mat-menu #accountMenu="matMenu" xPosition="before">
        @if (user(); as current) {
          <div class="account-details">
            <strong>{{ current.name }}</strong>
            <span>{{ current.email }}</span>
          </div>
          <mat-divider />
        }
        <button mat-menu-item (click)="signOut()">
          <mat-icon>logout</mat-icon>
          Sign out
        </button>
      </mat-menu>
    } @else {
      <a mat-button routerLink="/sign-in" routerLinkActive="active">Sign in</a>
      <a mat-flat-button routerLink="/sign-up">Sign up</a>
    }
  </nav>
</mat-toolbar>

<main>
  <router-outlet />
</main>
