<ion-content>
  <div class="page-content">
    <div class="toolbar">
      <ion-button
        fill="clear"
        routerLink="/"
        routerDirection="back"
        class="back"
      >
        <ion-icon slot="start" name="arrow-back" />
        All books
      </ion-button>
      @if (book(); as current) {
        <div class="actions">
          @if (current.level) {
            <ion-button
              fill="outline"
              color="secondary"
              class="change-level"
              (click)="openLevel()"
            >
              <ion-icon slot="start" name="school-outline" />
              Change level
            </ion-button>
          }
          <ion-button
            fill="outline"
            color="danger"
            class="delete"
            [disabled]="deleting().includes(current.id)"
            (click)="deleteBook(current)"
          >
            <ion-icon slot="start" name="trash-outline" />
            {{ current.level ? 'Delete list' : 'Delete book' }}
          </ion-button>
        </div>
      }
    </div>

    @if (loading()) {
      <div class="status" role="status">
        <ion-spinner name="crescent" />
        <span>Loading book…</span>
      </div>
    } @else if (error(); as message) {
      <div class="status error" role="alert">
        <ion-icon name="alert-circle-outline" aria-hidden="true" />
        <span>{{ message }}</span>
        <ion-button fill="clear" (click)="retry()">Retry</ion-button>
      </div>
    } @else if (book(); as current) {
      <app-book-details-card
        [book]="current"
        [words]="words()"
        (pageChange)="changePage($event)"
      />
    }
  </div>
</ion-content>
