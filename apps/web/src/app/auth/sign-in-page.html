<ion-content>
  <div class="page-content">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Sign in</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <ion-input
            label="Email"
            labelPlacement="floating"
            fill="outline"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
            [errorText]="
              controls.email.hasError('required')
                ? 'Email is required.'
                : 'Enter a valid email address.'
            "
          />

          <ion-input
            label="Password"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            required
            errorText="Password is required."
          >
            <ion-input-password-toggle slot="end" />
          </ion-input>

          @if (error(); as message) {
            <p class="error" role="alert">
              <ion-icon name="alert-circle-outline" aria-hidden="true" />
              {{ message }}
            </p>
          }

          <div class="actions">
            <ion-button type="submit" [disabled]="submitting()">
              Sign in
            </ion-button>
            @if (submitting()) {
              <ion-spinner name="crescent" />
            }
          </div>
        </form>

        <p class="switch">
          New here?
          <a routerLink="/sign-up" [queryParams]="{ returnUrl: returnUrl() }"
            >Create an account</a
          >
        </p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
