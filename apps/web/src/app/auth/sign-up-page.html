<ion-content>
  <div class="page-content">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Create an account</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <ion-input
            label="Name"
            labelPlacement="floating"
            fill="outline"
            formControlName="name"
            autocomplete="name"
            required
            [errorText]="
              controls.name.hasError('maxlength')
                ? 'Name must be at most ' + limits.name + ' characters.'
                : 'Name is required.'
            "
          />

          <ion-input
            label="Email"
            labelPlacement="floating"
            fill="outline"
            type="email"
            formControlName="email"
            autocomplete="email"
            required
            [errorText]="
              controls.email.hasError('required')
                ? 'Email is required.'
                : 'Enter a valid email address.'
            "
          />

          <ion-input
            label="Password"
            labelPlacement="floating"
            fill="outline"
            type="password"
            formControlName="password"
            autocomplete="new-password"
            required
            [helperText]="'At least ' + limits.passwordMin + ' characters.'"
            [errorText]="passwordError()"
          >
            <ion-input-password-toggle slot="end" />
          </ion-input>

          @if (error(); as message) {
            <p class="error" role="alert">
              <ion-icon name="alert-circle-outline" aria-hidden="true" />
              {{ message }}
            </p>
          }

          <div class="actions">
            <ion-button type="submit" [disabled]="submitting()">
              Sign up
            </ion-button>
            @if (submitting()) {
              <ion-spinner name="crescent" />
            }
          </div>
        </form>

        <p class="switch">
          Already have an account?
          <a routerLink="/sign-in" [queryParams]="{ returnUrl: returnUrl() }"
            >Sign in</a
          >
        </p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
